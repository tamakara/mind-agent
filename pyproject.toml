[project]
name = "workhub"
version = "0.1.0"
description = "A conversational enterprise service entry point for Feishu."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.21,<1",
    "chromadb>=1,<2",
    "fastapi>=0.116,<1",
    "langchain-openai>=0.3,<2",
    "langchain-text-splitters>=0.3,<2",
    "langgraph>=0.6,<2",
    "lark-oapi>=1.4,<2",
    "mcp>=1.12,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.workspace]
members = ["mock-oa-service"]

[tool.hatch.build.targets.wheel]
packages = ["src/workhub"]
