[project]
name = "workhub"
version = "0.1.0"
description = "A conversational enterprise service entry point for Feishu."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.16,<2",
    "chromadb>=1,<2",
    "fastapi>=0.116,<1",
    "jsonschema>=4.25,<5",
    "langchain-openai>=0.3,<2",
    "langchain-text-splitters>=0.3,<2",
    "langgraph>=0.6,<2",
    "lark-oapi>=1.4,<2",
    "mcp>=1.12,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "pyjwt>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tzdata>=2025.2",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.workspace]
members = ["mock-oa-service"]

[tool.hatch.build.targets.wheel]
packages = ["src/workhub"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--basetemp=.pytest-tmp",
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]
asyncio_mode = "auto"
testpaths = ["tests", "mock-oa-service/tests"]
pythonpath = ["src", "mock-oa-service/src"]
markers = [
    "contract: stable package and external boundary contracts",
    "integration: interactions across package or process boundaries",
]
