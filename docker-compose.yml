services:
  workhub:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      WORKHUB_DATA_DIR: /data/workhub
      WORKHUB_STATIC_DIR: /app/frontend-dist
      WORKHUB_HOST: 0.0.0.0
      WORKHUB_PORT: 8000
      WORKHUB_MOCK_OA_MCP_URL: http://mock-oa:8001/mcp
    ports:
      - "8000:8000"
    volumes:
      - workhub-data:/data/workhub
    depends_on:
      mock-oa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz', timeout=2); u.urlopen('http://127.0.0.1:8000/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mock-oa:
    build:
      context: .
      dockerfile: mock-oa-service/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      MOCK_OA_DATA_DIR: /data/mock-oa
      MOCK_OA_HOST: 0.0.0.0
      MOCK_OA_PORT: 8001
    ports:
      - "8001:8001"
    volumes:
      - mock-oa-data:/data/mock-oa
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  workhub-data:
  mock-oa-data:
