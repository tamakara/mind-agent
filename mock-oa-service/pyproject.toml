[project]
name = "mock-oa-service"
version = "0.1.0"
description = "Independent Mock OA service for WorkHub."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.21,<1",
    "fastapi>=0.116,<1",
    "mcp>=1.12,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_oa_service"]
